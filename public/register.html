<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - ForoDisco</title>
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Variables de colores */
        :root {
            --primary-color: #ff4b6e;
            --primary-light: #ff6b8b;
            --primary-dark: #e63e5c;
            --secondary-color: #3a86ff;
            --secondary-light: #5b9fff;
            --dark-bg: #121212;
            --darker-bg: #0a0a0a;
            --card-bg: #1e1e1e;
            --input-bg: #2a2a2a;
            --light-text: #ffffff;
            --gray-text: #b0b0b0;
            --border-color: #333;
            --success: #4caf50;
            --error: #f44336;
        }
        
        /* Estilos generales */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 90% 20%, rgba(255, 75, 110, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 10% 80%, rgba(58, 134, 255, 0.1) 0%, transparent 20%);
            color: var(--light-text);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Estilos de la navegación */
        .navbar {
            background-color: black;
            padding: 1rem 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 4rem;
        }

        .nav-brand {
            color: #ff4b6e;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.5rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
            font-size: 1.1rem;
        }

        .nav-links a:hover {
            color: #ff4b6e;
        }

        .auth-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn-login, .btn-register {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-login {
            background-color: white;
            color: black;
            border: 1px solid white;
        }

        .btn-login:hover {
            background-color: #e0e0e0;
        }

        .btn-register {
            color: white;
            border: 1px solid white;
            background: transparent;
        }

        .btn-register:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        /* Contenedor principal */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        
        /* Contenedor de registro */
        .register-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 450px;
            padding: 2.5rem;
            animation: fadeIn 0.6s ease;
            position: relative;
            overflow: hidden;
        }
        
        .register-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--secondary-color), var(--primary-color));
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .register-container h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--light-text);
            font-size: 2rem;
            font-weight: 600;
            position: relative;
            padding-bottom: 10px;
        }
        
        .register-container h1::after {
            content: '';
            position: absolute;
            width: 50px;
            height: 3px;
            background-color: var(--secondary-color);
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        
        /* Estilos del formulario */
        .form-group {
            margin-bottom: 1.8rem;
            position: relative;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.6rem;
            color: var(--gray-text);
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }
        
        .form-group input {
            width: 100%;
            padding: 1rem 1rem 1rem 2.8rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--input-bg);
            color: var(--light-text);
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .form-group input:focus {
            border-color: var(--secondary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(58, 134, 255, 0.2);
        }
        
        .form-group i {
            position: absolute;
            left: 1rem;
            top: 2.7rem;
            color: var(--gray-text);
            transition: all 0.3s ease;
        }
        
        .form-group input:focus + i {
            color: var(--secondary-color);
        }
        
        .btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--secondary-color), var(--secondary-light));
            color: var(--light-text);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(58, 134, 255, 0.3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.6s ease;
        }
        
        .btn:hover {
            background: linear-gradient(135deg, var(--secondary-light), var(--secondary-color));
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(58, 134, 255, 0.4);
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .error-message {
            color: var(--error);
            margin-top: 1.2rem;
            font-size: 0.9rem;
            display: none;
            padding: 0.8rem;
            background-color: rgba(244, 67, 54, 0.1);
            border-radius: 8px;
            border-left: 3px solid var(--error);
            animation: shake 0.5s ease;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        /* Enlaces */
        .login-link {
            text-align: center;
            margin-top: 2rem;
            color: var(--gray-text);
            position: relative;
            padding-top: 1.5rem;
        }
        
        .login-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 25%;
            width: 50%;
            height: 1px;
            background-color: var(--border-color);
        }
        
        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .login-link a:hover {
            color: var(--primary-light);
        }
        
        .login-link a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            background-color: var(--primary-light);
            bottom: -2px;
            left: 0;
            transition: width 0.3s ease;
        }
        
        .login-link a:hover::after {
            width: 100%;
        }
        
        /* Indicador de fuerza de contraseña */
        .password-strength {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: var(--gray-text);
            display: flex;
            align-items: center;
        }
        
        .password-strength-meter {
            height: 4px;
            width: 100%;
            background-color: var(--border-color);
            margin-top: 0.5rem;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .password-strength-meter span {
            display: block;
            height: 100%;
            width: 0;
            transition: width 0.3s ease;
        }
        
        .strength-weak {
            background-color: var(--error);
        }
        
        .strength-medium {
            background-color: #ff9800;
        }
        
        .strength-strong {
            background-color: var(--success);
        }
        
        /* Footer */
        footer {
            background-color: var(--darker-bg);
            padding: 1.2rem;
            text-align: center;
            color: var(--gray-text);
            font-size: 0.9rem;
            margin-top: auto;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .register-container {
                padding: 2rem;
                margin: 0 1rem;
            }
            
            .nav-center {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .nav-links {
                margin-top: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar">
        <div class="nav-center">
            <a href="index.html" class="nav-brand">ForoDisco</a>
            <div class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="foros.html">Tus Foros</a>
                <a href="tendencias.html">Nuevas Tendencias</a>
                <a href="search.html">Buscar</a>
            </div>
            <div class="auth-buttons">
                <a href="login.html" class="btn-login">Iniciar sesión</a>
                <a href="register.html" class="btn-register">Registrarse</a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="register-container">
            <h1>Crear Cuenta</h1>
            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" name="username" required>
                    <i class="fas fa-user"></i>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                    <i class="fas fa-lock"></i>
                    <div class="password-strength">
                        <div class="password-strength-meter">
                            <span id="passwordStrengthBar"></span>
                        </div>
                    </div>
                    <div id="passwordStrengthText" class="password-strength"></div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                    <i class="fas fa-check-circle"></i>
                </div>
                <button type="submit" class="btn">Crear Cuenta</button>
                <div id="errorMessage" class="error-message"></div>
            </form>
            <div class="login-link">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 ForoDisco. Todos los derechos reservados.</p>
    </footer>

    <script>
        const registerForm = document.getElementById('registerForm');
        const errorMessage = document.getElementById('errorMessage');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const passwordStrengthBar = document.getElementById('passwordStrengthBar');
        const passwordStrengthText = document.getElementById('passwordStrengthText');

        // Función para verificar la fuerza de la contraseña
        function checkPasswordStrength(password) {
            let strength = 0;
            
            // Si la contraseña tiene 8 o más caracteres
            if (password.length >= 8) strength += 1;
            
            // Si la contraseña tiene letras minúsculas y mayúsculas
            if (password.match(/([a-z].*[A-Z])|([A-Z].*[a-z])/)) strength += 1;
            
            // Si la contraseña tiene números
            if (password.match(/([0-9])/)) strength += 1;
            
            // Si la contraseña tiene caracteres especiales
            if (password.match(/([!,%,&,@,#,$,^,*,?,_,~])/)) strength += 1;
            
            // Actualizar la barra de fuerza
            if (password.length === 0) {
                passwordStrengthBar.style.width = '0%';
                passwordStrengthBar.className = '';
                passwordStrengthText.textContent = '';
            } else if (strength < 2) {
                passwordStrengthBar.style.width = '25%';
                passwordStrengthBar.className = 'strength-weak';
                passwordStrengthText.textContent = 'Débil';
                passwordStrengthText.style.color = '#f44336';
            } else if (strength === 2) {
                passwordStrengthBar.style.width = '50%';
                passwordStrengthBar.className = 'strength-medium';
                passwordStrengthText.textContent = 'Media';
                passwordStrengthText.style.color = '#ff9800';
            } else if (strength === 3) {
                passwordStrengthBar.style.width = '75%';
                passwordStrengthBar.className = 'strength-strong';
                passwordStrengthText.textContent = 'Fuerte';
                passwordStrengthText.style.color = '#4caf50';
            } else {
                passwordStrengthBar.style.width = '100%';
                passwordStrengthBar.className = 'strength-strong';
                passwordStrengthText.textContent = 'Muy fuerte';
                passwordStrengthText.style.color = '#4caf50';
            }
        }

        // Evento para verificar la fuerza de la contraseña mientras se escribe
        passwordInput.addEventListener('input', function() {
            checkPasswordStrength(this.value);
        });

        // Evento para verificar que las contraseñas coincidan
        confirmPasswordInput.addEventListener('input', function() {
            if (this.value !== passwordInput.value) {
                this.style.borderColor = '#f44336';
                this.style.boxShadow = '0 0 0 3px rgba(244, 67, 54, 0.2)';
            } else {
                this.style.borderColor = '#4caf50';
                this.style.boxShadow = '0 0 0 3px rgba(76, 175, 80, 0.2)';
            }
        });

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            // Verificar que las contraseñas coincidan
            if (password !== confirmPassword) {
                errorMessage.textContent = 'Las contraseñas no coinciden';
                errorMessage.style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();
                
                if (response.ok) {
                    // Redirigir a la página de login
                    window.location.href = 'login.html?registered=true';
                } else {
                    // Mostrar error
                    errorMessage.textContent = data.message || 'Error al registrarse';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                console.error('Error:', error);
                errorMessage.textContent = 'Error de conexión';
                errorMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
