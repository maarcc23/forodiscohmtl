<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tus Foros Guardados - ForoDisco</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff4b6e;
            --background-color: #1a1a1a;
            --card-bg: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-primary);
        }

        .navbar {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            background: linear-gradient(45deg, var(--primary-color), #ff8fb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 75, 110, 0.3);
        }

        .forum-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .forum-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .forum-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
            border-color: var(--primary-color);
        }

        .forum-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255, 75, 110, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .forum-card:hover::before {
            opacity: 1;
        }

        .forum-title {
            font-size: 1.5rem;
            color: var(--text-primary);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .forum-description {
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .forum-location {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .forum-location i {
            color: var(--primary-color);
        }

        .forum-actions {
            display: flex;
            gap: 1rem;
            margin-top: auto;
        }

        .btn {
            flex: 1;
            padding: 0.8rem;
            border-radius: 12px;
            border: none;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .btn-remove {
            background: rgba(220, 53, 69, 0.1);
            color: #ff4b6e;
        }

        .btn-remove:hover {
            background: rgba(220, 53, 69, 0.2);
            transform: scale(1.02);
        }

        .btn-view {
            background: var(--primary-color);
            color: white;
        }

        .btn-view:hover {
            background: #ff3d63;
            transform: scale(1.02);
        }

        .no-forums {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--card-bg);
            border-radius: 20px;
            grid-column: 1 / -1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .no-forums h3 {
            color: var(--text-primary);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .no-forums p {
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .forum-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" style="color: var(--primary-color); text-decoration: none; font-size: 1.5rem; font-weight: bold;">
                ForoDisco
            </a>
            <div class="d-flex">
                <div id="authButtons"></div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Tus Foros Guardados</h1>
        <div id="savedForumsList" class="forum-grid">
            <!-- Los foros se cargarán aquí dinámicamente -->
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        async function loadSavedForums() {
            try {
                const user = JSON.parse(localStorage.getItem('user'));
                if (!user) {
                    window.location.href = '/login.html';
                    return;
                }

                const response = await fetch(`/api/users/${user.id}/saved-forums`);
                const data = await response.json();
                
                const forumsList = document.getElementById('savedForumsList');
                
                if (!data.forums || data.forums.length === 0) {
                    forumsList.innerHTML = `
                        <div class="no-forums">
                            <h3>No tienes foros guardados</h3>
                            <p>Explora los foros disponibles y guarda tus favoritos</p>
                        </div>
                    `;
                    return;
                }

                forumsList.innerHTML = data.forums.map(forum => `
                    <div class="forum-card">
                        <h2 class="forum-title">${forum.name}</h2>
                        <p class="forum-description">${forum.description}</p>
                        <p class="forum-location">
                            <i class="fas fa-map-marker-alt"></i>
                            ${forum.location || 'Ubicación no disponible'}
                        </p>
                        <div class="forum-actions">
                            <button onclick="removeForum(${forum.id}, this)" class="btn btn-remove">
                                <i class="fas fa-trash"></i>
                                Eliminar
                            </button>
                            <button onclick="viewForum(${forum.id})" class="btn btn-view">
                                <i class="fas fa-eye"></i>
                                Ver Foro
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error al cargar los foros:', error);
            }
        }

        async function removeForum(forumId, button) {
            try {
                const user = JSON.parse(localStorage.getItem('user'));
                if (!user) return;

                const response = await fetch(`/api/forums/${forumId}/save`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userId: user.id })
                });

                const data = await response.json();

                if (data.success) {
                    // Eliminar la tarjeta del foro
                    const forumCard = button.closest('.forum-card');
                    forumCard.remove();

                    // Si no quedan foros, mostrar mensaje
                    if (document.querySelectorAll('.forum-card').length === 0) {
                        document.getElementById('savedForumsList').innerHTML = `
                            <div class="no-forums">
                                <h3>No tienes foros guardados</h3>
                                <p>Explora los foros disponibles y guarda tus favoritos</p>
                            </div>
                        `;
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al eliminar el foro');
            }
        }

        function viewForum(forumId) {
            window.location.href = `/forum.html?id=${forumId}`;
        }

        // Cargar los foros guardados cuando se carga la página
        document.addEventListener('DOMContentLoaded', loadSavedForums);
    </script>
</body>
</html>
