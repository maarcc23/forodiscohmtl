<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tus Foros Guardados - ForoDisco</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="js/auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh;
            position: relative;
        }
        
        .navbar {
            background-color: black;
            padding: 1rem 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 4rem;
        }

        .nav-brand {
            color: #ffffff;
            text-shadow: 0px 0px 10px #ff4b6e,
            0px 0px 20px #ff4b6e,
            0px 0px 40px #ff4b6e,
            0px 0px 80px #ff4b6e;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.5rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
            font-size: 1.1rem;
        }

        .nav-links a:hover {
            color: #ff4b6e;
        }

        .auth-buttons {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn-login, .btn-register, .btn-logout, .btn-profile {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .btn-register, .btn-logout, .btn-profile {
            color: white;
            border: 1px solid white;
            background: transparent;
        }

        .btn-register:hover, .btn-logout:hover, .btn-profile:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-login {
            background-color: white;
            color: black;
            border: 1px solid white;
        }

        .btn-login:hover {
            background-color: #e0e0e0;
        }

        .btn-register, .btn-logout {
            color: white;
            border: 1px solid white;
            background: transparent;
        }

        .btn-register:hover, .btn-logout:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .user-info {
            color: white;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .username {
            color: #ff4b6e;
            font-weight: bold;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 20px 40px;
        }
        
        .section-title {
            font-size: 2rem;
            margin-bottom: 30px;
            text-align: center;
            color: #ff4081;
        }
        
        .section-title2 {
            font-size: 2rem;
            margin-bottom: 30px;
            text-align: center;
            color: #ff4081;
        }
        
        .forums-row {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding: 10px 0 30px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        
        .forums-row::-webkit-scrollbar {
            height: 8px;
        }
        
        .forums-row::-webkit-scrollbar-track {
            background: #2a2a2a;
            border-radius: 10px;
        }
        
        .forums-row::-webkit-scrollbar-thumb {
            background: #ff4081;
            border-radius: 10px;
        }
        
        .forum-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            min-width: 350px;
            max-width: 350px;
            height: 500px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid #333;
        }
        
        .forum-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border-color: #ff4081;
        }
        
        .forum-header {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        .forum-header h1 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            color: #ff4081;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .forum-description {
            margin-top: 45px;
            color: #ffffff;
            font-size: 0.9rem;
            margin-bottom: 10px;
            flex-grow: 1;
            overflow: hidden;
            display: -webkit-box;
            -webkit-box-orient: vertical;
        }
        
        .forum-meta {
            padding: 0 15px 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.85rem;
            color: #ffffff;
        }
        
        .venue-location, .venue-followers, .venue-category {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .venue-icon {
            font-size: 1rem;
            min-width: 20px;
            text-align: center;
        }
        
        .forum-actions {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            background-color: #252525;
            border-top: 1px solid #333;
            border-radius: 20px;
        }
        
        .btn-view, .btn-remove {
            padding: 8px 15px;
            border-radius: 20px;
            border: none;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.8rem;
        }
        
        .btn-view {
            background-color: #ff4081;
            color: #ffffff;
            text-decoration: none;
        }
        
        .btn-remove {
            background-color: transparent;
            border: 1px solid #002fff;
            color: #ff4081;
        }
        
        .btn-view:hover {
            background-color: #ff5a92;
        }
        
        .btn-remove:hover {
            background-color: rgba(255, 4, 4, 0.1);
        }
        
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        
        .blur-1, .blur-2 {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
        }
        
        .blur-1 {
            top: -100px;
            left: -100px;
            width: 500px;
            height: 500px;
            background-color: rgba(255, 64, 129, 0.15);
        }
        
        .blur-2 {
            bottom: -100px;
            right: -100px;
            width: 600px;
            height: 600px;
            background-color: rgba(33, 150, 243, 0.1);
        }
        
        @media (max-width: 768px) {
            .nav-center {
                flex-direction: column;
                gap: 15px;
            }
            
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .container {
                padding-top: 150px;
            }
        }
        
        /* Estilos para el mensaje de inicio de sesión */
        .login-required {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            max-width: 500px;
            margin: 40px auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid #333;
        }
        
        .login-required h3 {
            color: #ff4081;
            margin-bottom: 15px;
        }
        
        .login-required p {
            color: #b0b0b0;
            margin-bottom: 25px;
        }
        
        .login-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
        
        .login-buttons .btn-login,
        .login-buttons .btn-register {
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }
        
        .login-buttons .btn-login {
            background-color: #ff4081;
            color: white;
            border: 1px solid #ff4081;
        }
        
        .login-buttons .btn-register {
            background-color: transparent;
            border: 1px solid #ff4081;
            color: #ff4081;
        }
        
        .login-buttons .btn-login:hover {
            background-color: #ff5a92;
        }
        
        .login-buttons .btn-register:hover {
            background-color: rgba(255, 64, 129, 0.1);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-center">
            <a href="index.html" class="nav-brand">ForoDisco</a>
            <div class="nav-links">
                <a href="foros.html">Tus Foros</a>
                <a href="tendencias.html">Nuevas Tendencias</a>
                <a href="normas.html">Normas de Comunidad</a>
            </div>
            <div class="user-info" id="userInfo" style="display: none;">
                <span>Bienvenido, <span class="username" id="usernameDisplay">admin</span></span>
                <a href="perfil.html" class="btn-profile">Mi Perfil</a>
                <a href="#" onclick="logoutUser()" class="btn-logout">Cerrar sesión</a>
            </div>
            <div class="auth-buttons" id="authButtons">
                <a href="login.html" class="btn-login">Iniciar sesión</a>
                <a href="register.html" class="btn-register">Registrarse</a>
            </div>
        </div>
    </nav>
    <div class="background">
        <div class="blur-1"></div>
        <div class="blur-2"></div>
    </div>
    <div class="container"><br><br>
        <h1 class="section-title2">Tus Foros Guardados</h1><br>
        <div id="forumsContainer"></div>
    </div>
    <script src="js/forum.js"></script>
    <script>
        // Verificar autenticación al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            // Usar la función de auth.js para verificar la autenticación
            checkForumsAuth();
        });

        async function loadSavedForums() {
            const forumsContainer = document.getElementById('forumsContainer');
            forumsContainer.innerHTML = '<p style="color: #b0b0b0; text-align: center; padding: 20px;">Cargando tus foros guardados...</p>';
            
            try {
                // Obtener el usuario actual
                const currentUser = JSON.parse(localStorage.getItem('currentUser'));
                
                if (!currentUser || !currentUser.id) {
                    forumsContainer.innerHTML = `
                        <div class="login-required">
                            <h3>Inicia sesión para ver tus foros guardados</h3>
                            <p>Necesitas iniciar sesión para acceder a tus foros guardados.</p>
                            <div class="login-buttons">
                                <a href="login.html" class="btn-login">Iniciar sesión</a>
                                <a href="register.html" class="btn-register">Registrarse</a>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                // Obtener las venues favoritas del usuario usando el endpoint existente
                const response = await fetch('/api/user/venues', {
                    credentials: 'include' // Añadir credenciales para enviar cookies de sesión
                });
                
                if (!response.ok) {
                    throw new Error(`Error al obtener favoritos: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Datos recibidos de la API:', data);
                
                if (data && data.success && data.venues && data.venues.length > 0) {
                    // Mapear los datos para asegurarnos de que tienen el formato correcto
                    const venuesWithDetails = data.venues.map(venue => ({
                        id: venue.id,
                        name: venue.name || 'Sin nombre',
                        description: venue.description || 'Sin descripción',
                        location: venue.location || venue.address || 'Ubicación desconocida',
                        follower_count: venue.follower_count || 0
                    }));
                    
                    console.log('Venues con detalles mapeados:', venuesWithDetails);
                    
                    // Mostrar las venues con sus detalles completos
                    displaySavedVenues(venuesWithDetails);
                } else {
                    forumsContainer.innerHTML = '<p style="color: #b0b0b0; text-align: center; padding: 20px;">No tienes foros guardados.</p>';
                }
            } catch (error) {
                console.error('Error al cargar foros guardados:', error);
                
                // Intentar cargar desde localStorage como fallback
                try {
                    const savedVenues = JSON.parse(localStorage.getItem('savedVenues') || '[]');
                    
                    if (savedVenues.length > 0) {
                        displaySavedVenues(savedVenues);
                    } else {
                        forumsContainer.innerHTML = '<p style="color: #b0b0b0; text-align: center; padding: 20px;">No tienes foros guardados o no se pudieron cargar desde el servidor.</p>';
                    }
                } catch (localError) {
                    forumsContainer.innerHTML = '<p style="color: #b0b0b0; text-align: center; padding: 20px;">Error al cargar tus foros. Intenta de nuevo más tarde.</p>';
                }
            }
        }

        function displaySavedVenues(venues) {
            const forumsContainer = document.getElementById('forumsContainer');
            
            if (!venues || venues.length === 0) {
                forumsContainer.innerHTML = '<p style="color: #b0b0b0; text-align: center; padding: 20px;">No tienes foros guardados.</p>';
                return;
            }
            
            console.log('Venues a mostrar:', venues); // Para depuración
            
            // Crear contenedor para las tarjetas con scroll horizontal
            const cardsContainer = document.createElement('div');
            cardsContainer.className = 'forums-row';
            
            // Mostrar todas las venues guardadas
            venues.forEach((venue) => {
                // Asegurarse de que tenemos todos los campos necesarios
                if (!venue || typeof venue !== 'object' || !venue.id) {
                    console.warn('Venue inválida:', venue);
                    return;
                }
                
                const card = document.createElement('div');
                card.className = 'forum-card';
                card.dataset.id = venue.id;
                
                // Formatear el número de seguidores
                const followersFormatted = new Intl.NumberFormat('es-ES').format(venue.follower_count || 0);
                
                // Crear el HTML para la tarjeta con toda la información
                card.innerHTML = `
                    <div class="forum-header">
                        <h1>${venue.name || 'Sin nombre'}</h1>
                        <div class="forum-description">
                            <p style="color: #ffffff;">${venue.description || 'Sin descripción'}</p>
                        </div>
                    </div>
                    <div class="forum-meta">
                        <div class="venue-location">
                            <span class="venue-icon">📍</span>
                            <span>${venue.location || 'Ubicación desconocida'}</span>
                        </div>
                        <div class="venue-followers">
                            <span class="venue-icon">👥</span>
                            <span>${followersFormatted} seguidores</span>
                        </div>
                    </div>
                    <div class="forum-actions">
                        <a class="btn-view" href="foro.html?forum=${venue.id}">Ver Foro</a>
                        <button class="btn-remove" onclick="event.stopPropagation(); removeForum('${venue.id}', this, 'venue')">Eliminar</button>
                    </div>
                `;
                
                // Hacer que toda la tarjeta sea clickeable para ver el foro
                card.addEventListener('click', function() {
                    viewForum(venue.id);
                });
                
                cardsContainer.appendChild(card);
            });
            
            // Limpiar el contenedor anterior y añadir el nuevo
            forumsContainer.innerHTML = '';
            forumsContainer.appendChild(cardsContainer);
        }

        // Función para ver un foro específico
        function viewForum(forumId) {
            window.location.href = `index.html?forum=${forumId}`;
        }

        // Función para eliminar un foro guardado
        async function removeForum(forumId, button, type = 'forum') {
            if (!confirm('¿Estás seguro de que deseas eliminar este foro de tus guardados?')) {
                return;
            }
            
            try {
                // Mostrar indicador de carga
                button.disabled = true;
                button.textContent = 'Eliminando...';
                
                const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
                
                // Primero intentar eliminar de la base de datos
                if (currentUser && currentUser.id) {
                    try {
                        const response = await fetch(`/api/user/venues/${forumId}`, {
                            method: 'DELETE',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            credentials: 'include'
                        });
                        
                        const data = await response.json();
                        
                        if (!response.ok) {
                            console.warn('Error al eliminar de la API:', data.message);
                            // Si falla la API, continuamos con el fallback de localStorage
                        } else {
                            console.log('Foro eliminado correctamente de la base de datos');
                        }
                    } catch (apiError) {
                        console.warn('Error al comunicarse con la API:', apiError);
                        // Si hay un error de comunicación, continuamos con el fallback
                    }
                }
                
                // Eliminar del localStorage (como fallback o si no hay usuario autenticado)
                if (type === 'venue') {
                    let savedVenues = JSON.parse(localStorage.getItem('savedVenues') || '[]');
                    savedVenues = savedVenues.filter(venue => venue.id !== forumId);
                    localStorage.setItem('savedVenues', JSON.stringify(savedVenues));
                } else {
                    let savedForums = JSON.parse(localStorage.getItem('savedForums') || '[]');
                    savedForums = savedForums.filter(id => id !== parseInt(forumId));
                    localStorage.setItem('savedForums', JSON.stringify(savedForums));
                }
                
                // Eliminar la tarjeta del foro con una animación
                const forumCard = button.closest('.forum-card');
                forumCard.style.opacity = '0';
                
                setTimeout(() => {
                    forumCard.remove();
                    
                    // Si no quedan foros, mostrar mensaje
                    if (document.querySelectorAll('.forum-card').length === 0) {
                        document.getElementById('forumsContainer').innerHTML = '<p style="color: #b0b0b0; text-align: center; padding: 20px;">No tienes foros guardados.</p>';
                    }
                }, 300);
                
            } catch (error) {
                console.error('Error al eliminar foro:', error);
                alert('Error al eliminar el foro. Por favor, intenta de nuevo más tarde.');
                button.disabled = false;
                button.textContent = 'Eliminar';
            }
        }

        function logoutUser() {
            try {
                // Modificar el estado de autenticación
                const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
                currentUser.authenticated = false;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                
                // Redirigir a la página principal
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } catch (error) {
                console.error('Error al cerrar sesión:', error);
                alert('Error al cerrar sesión. Por favor, intenta de nuevo.');
            }
        }
    </script>
</body>
</html>
