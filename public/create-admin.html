<!DOCTYPE html>
<html>
<head>
    <title>Crear Admin</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            color: #ff4b6e;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #ffffff;
            box-sizing: border-box;
        }
        button {
            background-color: #ff4b6e;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #e63e5c;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            background-color: #2a2a2a;
            display: none;
        }
        .success {
            color: #4caf50;
        }
        .error {
            color: #f44336;
        }
        .home-link {
            margin-top: 20px;
            color: #3a86ff;
            text-decoration: none;
        }
        .home-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar" style="background-color: black; padding: 1rem 2rem; display: flex; justify-content: center; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px;">
        <div class="nav-center" style="display: flex; align-items: center; gap: 4rem;">
            <a href="index.html" class="nav-brand" style="color: #ff4b6e; font-weight: bold; text-decoration: none; font-size: 1.5rem;">ForoDisco</a>
            <div class="nav-links" style="display: flex; gap: 2rem;">
                <a href="index.html" style="color: white; text-decoration: none; transition: color 0.3s ease; font-size: 1.1rem;">Inicio</a>
                <a href="foros.html" style="color: white; text-decoration: none; transition: color 0.3s ease; font-size: 1.1rem;">Tus Foros</a>
                <a href="tendencias.html" style="color: white; text-decoration: none; transition: color 0.3s ease; font-size: 1.1rem;">Nuevas Tendencias</a>
                <a href="normas.html" style="color: white; text-decoration: none; transition: color 0.3s ease; font-size: 1.1rem;">Normas de Comunidad</a>
            </div>
            <div class="user-info" id="userInfo" style="color: white; display: none; align-items: center; gap: 1rem;">
                <span>Bienvenido, <span id="usernameDisplay" class="username" style="color: #ff4b6e; font-weight: bold;">Usuario</span></span>
                <a href="#" onclick="logoutUser()" class="btn-logout" style="color: white; border: 1px solid white; background: transparent; text-decoration: none; transition: all 0.3s ease; font-size: 0.9rem; padding: 0.5rem 1rem; border-radius: 20px;">Cerrar sesión</a>
            </div>
            <div class="auth-buttons" id="authButtons" style="display: flex; gap: 1rem; align-items: center;">
                <a href="login.html" class="btn-login" style="background-color: white; color: black; border: 1px solid white; text-decoration: none; transition: all 0.3s ease; font-size: 0.9rem; padding: 0.5rem 1rem; border-radius: 20px;">Iniciar sesión</a>
                <a href="register.html" class="btn-register" style="color: white; border: 1px solid white; background: transparent; text-decoration: none; transition: all 0.3s ease; font-size: 0.9rem; padding: 0.5rem 1rem; border-radius: 20px;">Registrarse</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Crear Usuario Administrador</h1>
        
        <div class="form-group">
            <label for="username">Nombre de usuario</label>
            <input type="text" id="username" placeholder="admin" value="admin">
        </div>
        
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="contraseña" value="admin123">
        </div>
        
        <button onclick="createAdmin()">Crear Usuario Admin</button>
        
        <div id="result"></div>
        
        <a href="index.html" class="home-link">Volver a la página principal</a>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Verificar autenticación al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
        });

        function createAdmin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                showResult('Por favor, completa todos los campos', 'error');
                return;
            }
            
            try {
                // Crear objeto de usuario administrador
                const adminUser = {
                    id: Date.now().toString(),
                    username: username,
                    password: password,  // En una aplicación real, esto debería estar hasheado
                    role: 'admin',
                    createdAt: new Date().toISOString()
                };
                
                // Guardar en localStorage
                localStorage.setItem('adminUser', JSON.stringify(adminUser));
                
                // También añadir a la lista de usuarios si existe
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const existingUserIndex = users.findIndex(u => u.username === username);
                
                if (existingUserIndex >= 0) {
                    users[existingUserIndex] = { ...users[existingUserIndex], ...adminUser };
                } else {
                    users.push(adminUser);
                }
                
                localStorage.setItem('users', JSON.stringify(users));
                
                showResult(`Usuario administrador "${username}" creado correctamente. Ahora puedes iniciar sesión con estas credenciales.`, 'success');
            } catch (error) {
                console.error('Error:', error);
                showResult('Error al crear usuario administrador: ' + error.message, 'error');
            }
        }
        
        function showResult(message, type) {
            const resultElement = document.getElementById('result');
            resultElement.textContent = message;
            resultElement.className = type;
            resultElement.style.display = 'block';
        }
        
        // Función de logout directa
        function logoutUser() {
            try {
                // Modificar el estado de autenticación
                const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
                currentUser.authenticated = false;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                
                console.log('Sesión cerrada correctamente');
                
                // Mostrar notificación o alerta
                alert('Sesión cerrada correctamente');
                
                // Redirigir a la página principal
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            } catch (error) {
                console.error('Error al cerrar sesión:', error);
                alert('Error al cerrar sesión. Por favor, intenta de nuevo.');
            }
        }
    </script>
</body>
</html>
