<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Denuncias - ForoDisco</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
        }

        .navbar {
            background-color: black;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar-brand {
            color: #ff4b6e;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.5rem;
        }

        .user-info {
            color: white;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .username {
            color: #ff4b6e;
            font-weight: bold;
        }

        .btn-logout {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            border: 1px solid white;
            background: transparent;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .admin-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .panel-title {
            color: #ff4b6e;
            margin-bottom: 2rem;
            text-align: center;
            font-size: 2rem;
            text-shadow: 0 0 10px rgba(255, 75, 110, 0.5);
        }

        .admin-menu {
            margin-bottom: 2rem;
        }

        .admin-links {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .admin-link {
            padding: 0.8rem 1.5rem;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
        }
        
        .admin-link:hover, .admin-link.active {
            background-color: rgba(255, 75, 110, 0.2);
            color: #ff4b6e;
        }

        .denuncias-container {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            overflow: hidden;
            margin-top: 1rem;
        }
        
        .denuncia-item {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .denuncia-item:last-child {
            border-bottom: none;
        }
        
        .denuncia-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .denuncia-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .denuncia-meta {
            font-size: 0.9em;
            color: #ccc;
        }
        
        .denuncia-content {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 5px;
            margin-top: 5px;
        }
        
        .denuncia-motivo {
            background-color: rgba(255, 75, 110, 0.1);
            padding: 1rem;
            border-radius: 5px;
            border-left: 3px solid #ff4b6e;
            margin-top: 5px;
        }
        
        .denuncia-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .btn-revisada {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-revisada:hover {
            background-color: #3d8b40;
        }
        
        .btn-descartar {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-descartar:hover {
            background-color: #d32f2f;
        }
        
        .btn-eliminar-comentario {
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-eliminar-comentario:hover {
            background-color: #f57c00;
        }
        
        .estado-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .estado-pendiente {
            background-color: #ffeb3b;
            color: #333;
        }
        
        .estado-revisada {
            background-color: #4CAF50;
            color: white;
        }
        
        .estado-descartada {
            background-color: #f44336;
            color: white;
        }
        
        .no-denuncias {
            padding: 2rem;
            text-align: center;
            color: #ccc;
        }
        
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        
        .filter-btn {
            padding: 8px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            cursor: pointer;
            color: white;
            transition: all 0.3s ease;
        }
        
        .filter-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .filter-btn.active {
            background-color: rgba(255, 75, 110, 0.2);
            color: #ff4b6e;
            border-color: #ff4b6e;
        }

        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .notification.success {
            background-color: rgba(76, 175, 80, 0.9);
        }
        
        .notification.error {
            background-color: rgba(244, 67, 54, 0.9);
        }

        .content-wrapper {
            padding: 1rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/index.html" class="navbar-brand">ForoDisco</a>
        <div class="user-info">
            <span>Admin: <span class="username" id="adminUsername"></span></span>
            <a href="#" id="logoutBtn" class="btn-logout">Cerrar sesión</a>
        </div>
    </nav>

    <div class="admin-container">
        <h1 class="panel-title">Panel de Administración - ForoDisco</h1>
        
        <div class="admin-menu">
            <h2>Menú de Administración</h2>
            <ul class="admin-links">
                <li><a href="/admin/panel.html" class="admin-link">Gestión de Discotecas</a></li>
                <li><a href="/admin/usuarios.html" class="admin-link">Gestión de Usuarios</a></li>
                <li><a href="/admin/denuncias.html" class="admin-link active">Gestión de Denuncias</a></li>
                <li><a href="/admin/delegados.html" class="admin-link">Gestión de Delegados</a></li>
            </ul>
        </div>

        <div class="content-wrapper">
            <div class="filters">
                <button class="filter-btn active" data-filter="todas">Todas</button>
                <button class="filter-btn" data-filter="pendiente">Pendientes</button>
                <button class="filter-btn" data-filter="revisada">Revisadas</button>
                <button class="filter-btn" data-filter="descartada">Descartadas</button>
            </div>
            
            <div class="denuncias-container" id="denunciasContainer">
                <!-- Las denuncias se cargarán aquí dinámicamente -->
                <div class="no-denuncias">
                    <p>Cargando denuncias...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Notificaciones -->
    <div id="notification" class="notification"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar si el usuario es administrador
            checkAdminAuth();
            
            // Cargar denuncias
            loadDenuncias();
            
            // Configurar filtros
            setupFilters();
            
            // Configurar evento de logout
            document.getElementById('logoutBtn').addEventListener('click', function(e) {
                e.preventDefault();
                logoutUser();
            });
        });
        
        // Función para verificar si el usuario es administrador
        async function checkAdminAuth() {
            try {
                const response = await fetch('/api/check-auth', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (!data.authenticated) {
                    // Redirigir a la página de inicio de sesión
                    window.location.href = '/login.html';
                    return;
                }
                
                if (!data.isAdmin) {
                    // Redirigir a la página principal si no es administrador
                    window.location.href = '/index.html';
                    return;
                }
                
                // Mostrar el nombre de usuario
                document.getElementById('adminUsername').textContent = data.username;
                
            } catch (error) {
                console.error('Error al verificar autenticación:', error);
                window.location.href = '/login.html';
            }
        }
        
        // Función para cargar las denuncias
        async function loadDenuncias(filter = 'todas') {
            try {
                const container = document.getElementById('denunciasContainer');
                container.innerHTML = `
                    <div class="no-denuncias">
                        <p>Cargando denuncias...</p>
                    </div>
                `;
                
                const response = await fetch(`/api/admin/denuncias?filter=${filter}`, {
                    method: 'GET',
                    credentials: 'include'
                });
                
                const data = await response.json();
                console.log('Respuesta de denuncias:', data);
                
                if (!data.success) {
                    container.innerHTML = `
                        <div class="no-denuncias">
                            <p>Error al cargar denuncias: ${data.message}</p>
                        </div>
                    `;
                    return;
                }
                
                if (data.denuncias.length === 0) {
                    container.innerHTML = `
                        <div class="no-denuncias">
                            <p>No hay denuncias ${filter !== 'todas' ? 'con este filtro' : ''}</p>
                        </div>
                    `;
                    return;
                }
                
                let html = '';
                
                data.denuncias.forEach(denuncia => {
                    const fecha = new Date(denuncia.created_at).toLocaleDateString('es-ES', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    
                    let estadoClass = '';
                    switch(denuncia.estado) {
                        case 'pendiente':
                            estadoClass = 'estado-pendiente';
                            break;
                        case 'revisada':
                            estadoClass = 'estado-revisada';
                            break;
                        case 'descartada':
                            estadoClass = 'estado-descartada';
                            break;
                    }
                    
                    html += `
                        <div class="denuncia-item">
                            <div class="denuncia-header">
                                <div class="denuncia-info">
                                    <h3>Denuncia #${denuncia.id}</h3>
                                    <div class="denuncia-meta">
                                        <span>Reportado por: ${denuncia.reportado_por || 'Usuario desconocido'}</span> | 
                                        <span>Fecha: ${fecha}</span> | 
                                        <span>Estado: <span class="estado-badge ${estadoClass}">${denuncia.estado.toUpperCase()}</span></span>
                                    </div>
                                </div>
                            </div>
                            <div class="denuncia-content">
                                <strong>Comentario denunciado:</strong>
                                <p>${denuncia.comentario_texto || 'Contenido no disponible'}</p>
                                <div class="denuncia-meta">
                                    <span>Autor: ${denuncia.comentario_autor || 'Autor desconocido'}</span> | 
                                    <span>ID del comentario: ${denuncia.comentario_id || 'ID no disponible'}</span>
                                </div>
                            </div>
                            <div class="denuncia-motivo">
                                <strong>Motivo de la denuncia:</strong>
                                <p>${denuncia.motivo || 'No se especificó un motivo'}</p>
                            </div>
                            <div class="denuncia-actions">
                                ${denuncia.estado === 'pendiente' ? `
                                    <button class="btn-revisada" onclick="cambiarEstadoDenuncia(${denuncia.id}, 'revisada')">Marcar como revisada</button>
                                    <button class="btn-descartar" onclick="cambiarEstadoDenuncia(${denuncia.id}, 'descartada')">Descartar</button>
                                    <button class="btn-eliminar-comentario" onclick="eliminarComentarioDenunciado(${denuncia.comentario_id})">Eliminar comentario</button>
                                ` : ''}
                                ${denuncia.estado === 'revisada' ? `
                                    <button class="btn-descartar" onclick="cambiarEstadoDenuncia(${denuncia.id}, 'descartada')">Descartar</button>
                                    <button class="btn-eliminar-comentario" onclick="eliminarComentarioDenunciado(${denuncia.comentario_id})">Eliminar comentario</button>
                                ` : ''}
                                ${denuncia.estado === 'descartada' ? `
                                    <button class="btn-revisada" onclick="cambiarEstadoDenuncia(${denuncia.id}, 'revisada')">Marcar como revisada</button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Error al cargar denuncias:', error);
                document.getElementById('denunciasContainer').innerHTML = `
                    <div class="no-denuncias">
                        <p>Error al cargar denuncias. Por favor, intenta de nuevo más tarde.</p>
                    </div>
                `;
            }
        }
        
        // Función para cambiar el estado de una denuncia
        async function cambiarEstadoDenuncia(denunciaId, nuevoEstado) {
            try {
                const response = await fetch(`/api/admin/denuncias/${denunciaId}/estado`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({ estado: nuevoEstado })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showNotification('Estado de la denuncia actualizado correctamente', 'success');
                    // Recargar denuncias
                    const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
                    loadDenuncias(activeFilter);
                } else {
                    showNotification('Error al actualizar estado: ' + data.message, 'error');
                }
            } catch (error) {
                console.error('Error al cambiar estado de denuncia:', error);
                showNotification('Error al actualizar estado de la denuncia', 'error');
            }
        }
        
        // Función para eliminar un comentario denunciado
        async function eliminarComentarioDenunciado(commentId) {
            if (!confirm('¿Estás seguro de que quieres eliminar este comentario?')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/comments/${commentId}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showNotification('Comentario eliminado correctamente', 'success');
                    // Recargar denuncias
                    const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
                    loadDenuncias(activeFilter);
                } else {
                    showNotification('Error al eliminar comentario: ' + data.message, 'error');
                }
            } catch (error) {
                console.error('Error al eliminar comentario:', error);
                showNotification('Error al eliminar comentario', 'error');
            }
        }
        
        // Función para configurar filtros
        function setupFilters() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            
            filterButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // Quitar clase active de todos los botones
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    
                    // Añadir clase active al botón clickeado
                    this.classList.add('active');
                    
                    // Cargar denuncias con el filtro seleccionado
                    const filter = this.dataset.filter;
                    loadDenuncias(filter);
                });
            });
        }
        
        // Función para mostrar notificaciones
        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = 'notification';
            notification.classList.add(type);
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        // Función para cerrar sesión
        async function logoutUser() {
            try {
                const response = await fetch('/api/logout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                // Limpiar localStorage
                localStorage.removeItem('currentUser');
                
                // Redirigir a la página principal
                window.location.href = '/index.html';
            } catch (error) {
                console.error('Error al cerrar sesión:', error);
                alert('Error al cerrar sesión. Por favor, intenta de nuevo.');
            }
        }
    </script>
</body>
</html>
